general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session                                  # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 1800                                         # 2.5min=150s,  10min=600s 
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
#listener {
    #    timeout = 600 
                                         # 2.5min=150s,  10min=600s
#   on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#   on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
#}

listener {
    timeout = 900                                 # 5min=300s, 15min = 900s
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 1800                                                                                 # 5.5min, change to 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 3600                               # 30min, change it to 1800 after
    on-timeout = systemctl suspend                # suspend pc
}

listener {
    timeout = 9999999                             # arbitrarily high timeout so it never triggers via idling
    on-sleep = hyprlock                           # physically launches hyprlock when systemd suspends (e.g. closing lid)
}
